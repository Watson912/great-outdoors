<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account — PNW Trails</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles/login.css"/>
  <link rel="icon" href="images/logo.png" sizes="64x64">
</head>
<body>

<!-- ── NAV ── -->
<nav id="main-nav">
  <a href="index.html" class="nav-logo"><img src="images/logo.png" alt="PNW Trails logo"></a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="trails.html">Trails</a></li>
    <li><a href="safety.html">Safety</a></li>
    <li><a href="community.html">Community</a></li>
    <li><a href="login.html">Sign In</a></li>
  </ul>
</nav>

<!-- ── HERO ── -->
<header class="hero">
  <h1>Join PNW Trails</h1>
  <p>Create an account to save trails and track your adventures.</p>
</header>

<!-- ── SIGNUP CARD ── -->
<main class="login-main">
  <div class="login-card">
    <h2 class="card-title">Create Account</h2>

    <form id="signup-form" novalidate>
      <div class="field-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required autocomplete="name"/>
      </div>

      <div class="field-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required autocomplete="email"/>
      </div>

      <div class="field-group">
        <label for="pass">Password</label>
        <input type="password" id="pass" name="pass" placeholder="At least 6 characters" required autocomplete="new-password"/>
      </div>

      <div class="field-group">
        <label for="confirm-pass">Confirm Password</label>
        <input type="password" id="confirm-pass" name="confirm-pass" placeholder="Repeat your password" required autocomplete="new-password"/>
      </div>

      <p id="error-msg" class="error-msg"></p>
      <button type="submit" class="btn-primary">Create Account</button>
    </form>

    <p class="signup-prompt">Already have an account? <a href="login.html">Sign in</a></p>
  </div>
</main>

<!-- ── FOOTER ── -->
<footer>
  <ul>
    <li>All Rights Reserved</li>
    <li>Copyright &copy; 2026</li>
    <li class="footer-socials">
      <a href="">Facebook</a>
      <a href="">Twitter</a>
      <a href="">Instagram</a>
    </li>
  </ul>
</footer>

<script type="module" src="scripts/signup.js"></script>
</body>
</html>
